 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <h1 class="text-center mb-5">Inventory Dashboard</h1>

    <div class="row g-4">

        <div class="col-md-6 col-lg-3">
            <div class="card shadow-sm text-center p-3">
                <h5>Total Products</h5>
                <h2>{{ total_products }}</h2>
            </div>
        </div>

        <div class="col-md-6 col-lg-3">
            <div class="card shadow-sm text-center p-3">
                <h5>Total Sales Records</h5>
                <h2>{{ total_sales }}</h2>
            </div>
        </div>

        <div class="col-md-6 col-lg-3">
            <div class="card shadow-sm text-center p-3">
                <h5>Total Stock Units</h5>
                <h2>{{ total_stock }}</h2>
            </div>
        </div>

        <div class="col-md-6 col-lg-3">
            <div class="card shadow-sm text-center p-3">
                <h5>Out-of-Stock Products</h5>
                <h2>{{ low_stock }}</h2>
            </div>
        </div>

    </div>
</div>

<div class="col-md-3 mx-auto">
    <div class="card text-center shadow-sm p-3">
        <h5>Total Revenue</h5>
        <h3>₹{{ total_revenue|floatformat:2 }}</h3>
    </div>
</div>

<div class="text-center mt-5">
    <!-- Keep your existing three links here -->
<a href="/products/" class="btn btn-primary">Product List</a>
<a href="/sales/history/" class="btn btn-success">Sales History</a>
<a href="/sales/analysis/" class="btn btn-warning">Sales Analysis</a>
</div>

</body>
</html>
